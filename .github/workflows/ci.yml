name: CI

# Type-check, unit tests and build on every PR. `astro check` runs the
# TypeScript checker over .astro, .svelte and .ts files: `astro build` alone
# does not check types, so a breaking TypeScript bump could still look green.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build
